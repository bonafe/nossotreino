<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Novo Exercício</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/componentes.css" />
  <link rel="stylesheet" href="css/paginas/treino-musculacao-novo.css" />
</head>
<body>
  <div id="confirmOverlay" class="overlay" hidden>
    <div class="confirm-card">
      <p id="confirmTexto"></p>
      <div class="confirm-botoes">
        <button id="confirmCancelar" class="secondary" type="button">Cancelar</button>
        <button id="confirmOk" class="danger" type="button">Excluir</button>
      </div>
    </div>
  </div>

  <main>
    <header class="top">
      <a id="voltarIcon" class="voltar-icon" href="treino_musculacao_novo.html" aria-label="Voltar">←</a>
      <div>
        <h1 id="titulo">Novo exercício</h1>
      </div>
    </header>

    <div id="carregando" class="estado">Carregando…</div>

    <div id="erro" class="estado" hidden></div>

    <form id="formExercicio" hidden>
      <div id="camposDinamicos"></div>

      <button type="button" id="salvarBtn" class="primary">Salvar exercício</button>
      <button type="button" id="excluirBtn" class="danger" hidden>Excluir exercício personalizado</button>

      <div id="mensagem" class="mensagem" hidden></div>
    </form>

    <p class="rodape-apoio"><a href="index.html#apoio">❤️ Apoiar o Nosso Treino</a></p>
  </main>

  <script type="module" src="js/paginas/exercicio-novo.js"></script>
</body>
</html>
