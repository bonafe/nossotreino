<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Atividade Livre</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/componentes.css" />
  <link rel="stylesheet" href="css/graficos.css" />
  <link rel="stylesheet" href="css/paginas/atividade-livre-menu.css" />
</head>
<body>
  <main>
    <header class="top">
      <a class="voltar-icon" href="sistema.html" aria-label="Voltar">←</a>
      <div>
        <h1>🏃 Atividade Livre</h1>
        <p class="subtitle">Registre horário e duração de qualquer atividade.</p>
      </div>
      <a class="icon-btn" href="atividade_livre_novo.html" aria-label="Registrar atividade">+</a>
    </header>

    <section id="graficoSecao" class="grafico-secao" hidden>
      <div class="grafico-topo">
        <h2>Tempo de atividade livre</h2>
        <div class="periodo-botoes" role="group" aria-label="Período do gráfico">
          <button type="button" class="periodo-btn active" data-periodo="7d">7 dias</button>
          <button type="button" class="periodo-btn" data-periodo="30d">30 dias</button>
          <button type="button" class="periodo-btn" data-periodo="meses">Meses</button>
        </div>
      </div>
      <svg id="graficoAtividadeLivre" viewBox="0 0 800 240" preserveAspectRatio="xMidYMid meet"></svg>
    </section>
    <div id="graficoVazio" class="estado" hidden>Nenhuma atividade registrada ainda.</div>

    <div id="lista" class="lista">
      <div class="estado">Carregando…</div>
    </div>

    <p class="rodape-apoio"><a href="index.html#apoio">❤️ Apoiar o Nosso Treino</a></p>
  </main>

  <script src="d3.v7.min.js"></script>
  <script type="module" src="js/paginas/atividade-livre-menu.js"></script>
</body>
</html>
